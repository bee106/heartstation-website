<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음 정거장 - 스트레스 해소</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
    h1 { color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
    p {  color: #2c3e50; font-size: 4px;  }
    
    /* 참여자 수 카운터 */
    .counter-text { font-size: 14px; color: #16a085; font-weight: bold; margin-bottom: 20px; background: #e8f8f5; display: inline-block; padding: 5px 15px; border-radius: 20px; }
    
    .tips-box { background: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; font-size: 15px; }
    button.submit-btn { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button.submit-btn:hover { background: #2980b9; }
    
    .shared-list { margin-top: 30px; text-align: left; }
    .card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: #888; }
    .method-text { font-size: 15px; color: #333; line-height: 1.4; word-break: keep-all; margin-bottom: 10px; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .like-btn { background: none; border: none; font-size: 14px; cursor: pointer; color: #e74c3c; display: flex; align-items: center; gap: 5px; padding: 0; }
    
    .btn-group { display: flex; gap: 5px; }
    button.edit-btn { background: #f39c12; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button.delete-btn { background: #e74c3c; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    /* 팝업(Toast) 메시지 스타일 */
    #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 15px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
    #toast.show { visibility: visible; opacity: 1; }

    /* 맞춤형 모달(수정 창) 스타일 */
    #editModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
    .modal-content input { width: 100%; margin-bottom: 15px; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btns button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; }
    .save-btn { background: #3498db; color: white; }
    .cancel-btn { background: #95a5a6; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌱 마음 정거장</h1>
    <div class="counter-text">지금까지 <span id="userCount">0</span>개의 마음에 짐을 덜었어요!</div>

    <div class="tips-box">
      <h3>추천 스트레스 해소법</h3>
      <!-- 이미지 경로는 로컬 파일명으로 변경해두었습니다 -->
      <img src="tips.png" alt="스트레스 해소법 10가지" style="width: 100%; max-width: 100%; border-radius: 8px;">
    </div>

    <h3 style="text-align: left;">나만의 스트레스 해소법은?</h3>
    <p style="text-align: left;">자신만의 스트레스 해소법을 공유해주세요!</p>
    <input type="text" id="myMethod" placeholder="예: 코인노래방 가서 3곡 부르기">
    <button id="submitBtn" class="submit-btn">공유하기</button>

    <div class="shared-list">
      <h3>다른 분들의 해소법 💡</h3>
      <div id="methodsContainer">
        <!-- 데이터가 여기에 추가됩니다 -->
      </div>
    </div>
  </div>

  <!-- 토스트 알림창 -->
  <div id="toast">메시지</div>

  <!-- 수정 모달창 -->
  <div id="editModal">
    <div class="modal-content">
      <h3>해소법 수정하기</h3>
      <input type="text" id="editInput">
      <div class="modal-btns">
        <button class="save-btn" id="modalSaveBtn">저장</button>
        <button class="cancel-btn" id="modalCancelBtn">취소</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 🔴 본인의 Firebase Config 값을 아래에 덮어써주세요!
    const firebaseConfig = {
      apiKey: "AIzaSyB9xazXebuXBmuUa1yn3o8JGFKTmhxDc_Q",
      authDomain: "heart-station-d4714.firebaseapp.com",
      projectId: "heart-station-d4714",
      storageBucket: "heart-station-d4714.firebasestorage.app",
      messagingSenderId: "209295999220",
      appId: "1:209295999220:web:5ce64e7047eb5a07d11ea1",
      measurementId: "G-SWKGPFD4T1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserUid = null;

    // 익명 로그인
    onAuthStateChanged(auth, (user) => {
      if (user) currentUserUid = user.uid;
      else signInAnonymously(auth).catch(console.error);
    });

    // 1️⃣ 예쁜 알림(Toast) 띄우는 함수
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerText = message;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // 2️⃣ "방금 전", "5분 전" 계산해주는 함수
    function timeAgo(date) {
      if (!date) return "방금 전"; // 방금 글을 썼을 때(서버 시간 저장 전)
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "년 전";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "달 전";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "일 전";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "시간 전";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "분 전";
      return "방금 전";
    }

    // 글 공유하기
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const inputVal = document.getElementById('myMethod').value;
      if (!currentUserUid) { showToast("접속 중입니다. 잠시 후 다시 시도해주세요."); return; }
      if (inputVal.trim() === "") { showToast("스트레스 해소법을 입력해주세요!"); return; }

      try {
        await addDoc(collection(db, "stress_methods"), {
          method: inputVal,
          uid: currentUserUid,
          likes: [], // 좋아요 목록 (빈 배열로 시작)
          createdAt: serverTimestamp()
        });
        document.getElementById('myMethod').value = ""; 
        showToast("공유 완료! 마음이 한결 가벼워지셨길 바라요. 🌱");
      } catch (e) {
        console.error("에러: ", e);
      }
    });

    // 실시간 데이터 불러오기
    const q = query(collection(db, "stress_methods"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('methodsContainer');
      container.innerHTML = ""; 
      
      // 3️⃣ 전체 참여(작성된 글) 개수 카운터 업데이트
      document.getElementById('userCount').innerText = snapshot.size;

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        
        // 카드 상단: 날짜 표시 ("방금 전" 등)
        const headerDiv = document.createElement('div');
        headerDiv.className = 'card-header';
        const dateSpan = document.createElement('span');
        dateSpan.innerText = timeAgo(data.createdAt?.toDate());
        headerDiv.appendChild(dateSpan);
        cardDiv.appendChild(headerDiv);

        // 본문 내용
        const textDiv = document.createElement('div');
        textDiv.className = 'method-text';
        textDiv.innerText = data.method;
        cardDiv.appendChild(textDiv);

        // 카드 하단: 좋아요 및 버튼 그룹
        const footerDiv = document.createElement('div');
        footerDiv.className = 'card-footer';

        // 4️⃣ 좋아요 기능
        const likeBtn = document.createElement('button');
        likeBtn.className = 'like-btn';
        const isLiked = data.likes && data.likes.includes(currentUserUid);
        likeBtn.innerHTML = (isLiked ? "❤️" : "🤍") + ` ${data.likes ? data.likes.length : 0}`;
        
        likeBtn.addEventListener('click', async () => {
          if (!currentUserUid) return;
          const docRef = doc(db, "stress_methods", docId);
          try {
            if (isLiked) {
              await updateDoc(docRef, { likes: arrayRemove(currentUserUid) });
            } else {
              await updateDoc(docRef, { likes: arrayUnion(currentUserUid) });
            }
          } catch (e) { console.error("좋아요 오류: ", e); }
        });
        footerDiv.appendChild(likeBtn);

        // 수정/삭제 버튼 (본인 글일 경우에만)
        if (currentUserUid && data.uid === currentUserUid) {
          const btnGroup = document.createElement('div');
          btnGroup.className = 'btn-group';

          // 모달창을 이용한 수정 버튼
          const editBtn = document.createElement('button');
          editBtn.className = 'edit-btn';
          editBtn.innerText = '수정';
          editBtn.addEventListener('click', () => {
            const modal = document.getElementById('editModal');
            const editInput = document.getElementById('editInput');
            editInput.value = data.method; // 기존 내용 넣기
            modal.style.display = 'flex';

            // 저장 버튼 이벤트 덮어씌우기 방지를 위한 원스 타임 함수 설정
            document.getElementById('modalSaveBtn').onclick = async () => {
              const newMethod = editInput.value.trim();
              if (newMethod !== "" && newMethod !== data.method) {
                await updateDoc(doc(db, "stress_methods", docId), { method: newMethod });
                showToast("수정되었습니다.");
              }
              modal.style.display = 'none';
            };
            
            document.getElementById('modalCancelBtn').onclick = () => {
              modal.style.display = 'none';
            };
          });

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.innerText = '삭제';
          deleteBtn.addEventListener('click', async () => {
            if(confirm("정말로 삭제할까요?")) {
              await deleteDoc(doc(db, "stress_methods", docId));
              showToast("삭제되었습니다.");
            }
          });
          
          btnGroup.appendChild(editBtn);
          btnGroup.appendChild(deleteBtn);
          footerDiv.appendChild(btnGroup);
        }

        cardDiv.appendChild(footerDiv);
        container.appendChild(cardDiv);
      });
    });
  </script>
</body>
</html>
